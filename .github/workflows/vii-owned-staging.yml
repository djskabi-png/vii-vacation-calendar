name: VII owned Cloudflare staging

on:
  push:
    branches:
      - migration/vii-owned-cloudflare-staging-20261125

permissions:
  contents: read

concurrency:
  group: vii-owned-staging
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: vii-owned-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node --test tests/booking-date-fields.actual.test.mjs tests/supplier-catalog-sync.test.mjs tests/gallery-candidate-archive.test.mjs
      - run: node .github/scripts/prepare-owned-cloudflare-staging.mjs --dry-run
      - run: pnpm exec wrangler deploy --dry-run --config dist/server/wrangler.owned-staging.json
      - name: Upload to the private staging Worker
        if: vars.VII_OWNED_STAGING_DEPLOY == 'enabled'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.VII_STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          export LC_ALL=C
          if ! [[ "$CLOUDFLARE_API_TOKEN" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
            echo "The staging deployment secret is missing or malformed." >&2
            exit 1
          fi
          node .github/scripts/prepare-owned-cloudflare-staging.mjs
          pnpm exec wrangler deploy --config dist/server/wrangler.owned-staging.json --message "GitHub ${GITHUB_SHA}"

  production-qualification:
    name: Production qualification (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.25.0 --activate
      - name: Install pinned application and browser-worker dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir services/vii-quality-browser install --frozen-lockfile
      - name: Build the exact candidate
        run: pnpm build
      - name: Run the complete regression suite
        id: regression
        run: node --test --test-reporter=tap tests/*.test.mjs > "$RUNNER_TEMP/vii-production-regression.tap" 2>&1
      - name: Report qualification for the exact source
        if: always()
        env:
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
        run: |
          {
            echo '### VII production regression'
            echo
            printf 'Source commit `%s`\n\n' "$GITHUB_SHA"
            printf 'Regression result `%s`\n' "$REGRESSION_OUTCOME"
            echo
            echo 'Public deployment requires separate restore, live-provider and rollback verification.'
            if [ -n "$(git status --porcelain)" ]; then
              echo
              echo 'Worktree changes produced during qualification'
              echo '```text'
              git status --porcelain | sed -n '1,40p'
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/vii-production-regression.tap" ]; then
              echo
              echo '```text'
              awk '/^not ok [0-9]+ - / || /^# (tests|pass|fail|cancelled|skipped|todo) [0-9]+$/ { print }' "$RUNNER_TEMP/vii-production-regression.tap"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
