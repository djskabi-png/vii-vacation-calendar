name: Package the verified VII release

on:
  push:
    branches: [release/prep-sites-e2369d33-20261125]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VII_SOURCE: e2369d33dbc789eccb3cd131f015e5d3b75e5bc8
      VII_ARCHIVE_PUBLIC_KEY: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e2369d33dbc789eccb3cd131f015e5d3b75e5bc8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.25.0 --activate
      - name: Build the exact source and verify browser continuity
        run: |
          test "$(git rev-parse HEAD)" = "$VII_SOURCE"
          pnpm install --frozen-lockfile
          pnpm build
          node --test tests/cross-release-client-reference-actual.test.mjs tests/booking-date-fields.actual.test.mjs tests/supplier-catalog-sync.test.mjs tests/gallery-candidate-archive.test.mjs
          test -z "$(git status --porcelain)"
      - name: Encrypt only the verified build for the owner's local workspace
        run: |
          tar -czf "$RUNNER_TEMP/vii-sites-dist.tar.gz" dist
          mkdir "$RUNNER_TEMP/vii-sites-encrypted"
          node --input-type=module <<'NODE'
          import { constants, createCipheriv, createHash, createPublicKey, publicEncrypt, randomBytes } from 'node:crypto';
          import { createReadStream, createWriteStream, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { Transform } from 'node:stream';
          import { pipeline } from 'node:stream/promises';

          const output = join(process.env.RUNNER_TEMP, 'vii-sites-encrypted');
          const recipient = createPublicKey({ key: Buffer.from(process.env.VII_ARCHIVE_PUBLIC_KEY, 'base64'), format: 'der', type: 'spki' });
          const key = randomBytes(32);
          const iv = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', key, iv);
          const source = process.env.VII_SOURCE;
          cipher.setAAD(Buffer.from(source));
          const sha = createHash('sha256');
          const digestArchive = new Transform({ transform(chunk, _encoding, callback) {
            sha.update(chunk);
            callback(null, chunk);
          } });
          await pipeline(createReadStream(join(process.env.RUNNER_TEMP, 'vii-sites-dist.tar.gz')), digestArchive, cipher, createWriteStream(join(output, 'dist.tar.gz.enc'), { flags: 'wx' }));
          const wrappedKey = publicEncrypt({ key: recipient, padding: constants.RSA_PKCS1_OAEP_PADDING, oaepHash: 'sha256' }, key);
          writeFileSync(join(output, 'manifest.json'), JSON.stringify({
            source, sha256: sha.digest('hex'), wrappedKey: wrappedKey.toString('base64'),
            iv: iv.toString('base64'), tag: cipher.getAuthTag().toString('base64'),
          }), { flag: 'wx' });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: vii-sites-encrypted-e2369d33
          path: ${{ runner.temp }}/vii-sites-encrypted/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
