name = "vii-quality-browser"
account_id = "45b2f6dcf2cfe44204d2c470cbe682d9"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[build]
command = "node services/vii-quality-browser/build-definition.mjs"

# Private service. The evidence bucket is provisioned; activation still
# requires an exact frozen source/build and observed browser execution.
[browser]
binding = "BROWSER"

[vars]
PUBLIC_ORIGIN = "https://vii.spaplus.co"
EXPECTED_SOURCE_VERSION = "SET_FROM_FROZEN_CANDIDATE"
EXPECTED_BUILD_ID = "SET_FROM_BUILT_ARTIFACT"
MAX_RUN_MS = "45000"
MAX_REQUESTS = "180"
MAX_EVIDENCE_BYTES = "1000000"

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "vii-quality-evidence"
